<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a100d" />
      <stop offset="60%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#070b09" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85" />
    </linearGradient>

    <!-- Neon Emerald to Cyan Gradient -->
    <linearGradient id="iceNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a100d" stop-opacity="0" />
    </radialGradient>

    <!-- Bloom Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle Base Canvas -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#bgGrad)" />
  
  <!-- 2. Ambient Core Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#centerGlow)" />

  <!-- 3. Glowing Outer Border -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="7" />
  <rect x="25" y="25" width="462" height="462" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- 4. Prominent Bold "ICE" Monogram Letters -->
  <g filter="url(#neonGlow)">
    <!-- Letter I -->
    <rect x="78" y="162" width="58" height="180" rx="16" fill="#22c55e" />
    <!-- Pulse dot above I -->
    <circle cx="107" cy="112" r="22" fill="#22c55e" />
    <circle cx="107" cy="112" r="32" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.45" />

    <!-- Letter C -->
    <rect x="168" y="162" width="142" height="52" rx="20" fill="#10b981" />
    <rect x="168" y="162" width="52" height="180" rx="20" fill="url(#iceNeon)" />
    <rect x="168" y="290" width="142" height="52" rx="20" fill="#06b6d4" />

    <!-- Letter E -->
    <rect x="344" y="162" width="48" height="180" rx="18" fill="#06b6d4" />
    <rect x="344" y="162" width="98" height="48" rx="18" fill="#10b981" />
    <rect x="344" y="228" width="84" height="48" rx="18" fill="#22c55e" />
    <rect x="344" y="294" width="98" height="48" rx="18" fill="#06b6d4" />

    <!-- 5. Active Dynamic Wave under ICE -->
    <path d="M 78 382 H 200 L 225 366 L 250 398 L 275 374 L 300 382 H 442" 
          fill="none" 
          stroke="#22c55e" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Wave Pulse Node -->
    <circle cx="250" cy="398" r="9" fill="#ffffff" />
  </g>
</svg>
